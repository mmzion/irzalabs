<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Power Control by IRZA Labs</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <!-- Fonts & icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0a0f16;
            --surface: #141b23;
            --border: rgba(148,197,224,0.12);
            --text: #e6edf3;
            --text-dim: #8896a6;
            --cyan: #22d3ee;
            --amber: #fbbf24;
            --red: #f87171;
            --green: #34d399;
            --radius: 14px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-display);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* Login */
        #loginBox {
            max-width: 380px;
            margin: 120px auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 28px;
        }
        .login-icon {
            width: 52px; height: 52px;
            border-radius: 12px;
            margin: 0 auto 20px;
            background: rgba(34,211,238,0.12);
            border: 1px solid rgba(34,211,238,0.3);
            display: flex; align-items: center; justify-content: center;
            color: var(--cyan);
            font-size: 24px;
        }
        .login-box h2 { font-weight: 700; text-align: center; }
        .login-sub { text-align: center; color: var(--text-dim); font-size: 12px; margin: 8px 0 24px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
        .field input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 12px 14px; border-radius: 8px; color: #fff; font-size: 14px;
            outline: none; transition: border 0.15s;
        }
        .field input:focus { border-color: var(--cyan); }
        .btn {
            border: none; border-radius: 8px; font-weight: 600; padding: 11px 18px;
            cursor: pointer; font-size: 14px; transition: 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-login {
            width: 100%; background: var(--cyan); color: #00181f;
            margin-top: 8px; justify-content: center;
        }
        .btn-login:hover { filter: brightness(1.1); }
        .error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; }

        /* Header */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--cyan); font-size: 24px; }
        .brand h1 { font-size: 22px; font-weight: 700; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }
        .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .clock {
            font-family: var(--font-mono); font-size: 14px; color: var(--text-dim);
            padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
        }
        .btn-sm {
            background: transparent; border: 1px solid var(--border); color: var(--text-dim);
            padding: 6px 12px; font-size: 13px; border-radius: 6px;
        }
        .btn-sm:hover { background: rgba(255,255,255,0.05); color: var(--text); }

        /* Summary cards */
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 28px;
        }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px;
        }
        .card .label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
        .card .value { font-size: 24px; font-weight: 700; }
        .value.cyan { color: var(--cyan); }
        .value.amber { color: var(--amber); }

        /* Room cards */
        .rooms-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 16px; margin-bottom: 20px;
        }
        .room-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .room-card.overload { border-color: rgba(248,113,113,0.6); box-shadow: 0 0 18px rgba(248,113,113,0.2); }
        .room-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .room-header h3 { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .room-led {
            width: 10px; height: 10px; border-radius: 50%; background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }
        .room-led.off { background: var(--text-dim); box-shadow: none; }
        .room-led.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .room-status { font-size: 12px; color: var(--text-dim); }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 16px;
        }
        .metric {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px;
        }
        .metric .m-label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); }
        .metric .m-value { font-family: var(--font-mono); font-size: 18px; font-weight: 600; margin-top: 4px; }

        .progress-section { margin-bottom: 14px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
        .progress-bar {
            height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 4px; transition: width 0.4s;
            background: var(--green); width: 0%;
        }
        .progress-fill.warn { background: var(--amber); }
        .progress-fill.danger { background: var(--red); }

        .action-row {
            display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .action-row button {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--text); font-size: 12px; font-weight: 600; padding: 7px 12px;
            border-radius: 6px; cursor: pointer; transition: 0.15s;
        }
        .action-row button:hover { background: rgba(255,255,255,0.1); }
        .action-row input {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: #fff; padding: 6px; border-radius: 6px; width: 70px;
            font-family: var(--font-mono);
        }

        .breaker-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
        }
        .breaker-label { font-size: 12px; color: var(--text-dim); }
        .toggle-switch {
            width: 50px; height: 26px; border-radius: 13px;
            background: #2c3e50; position: relative; cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch.on { background: var(--green); }
        .toggle-switch.off { background: var(--red); }
        .toggle-switch::after {
            content: ""; position: absolute; top: 3px; left: 3px;
            width: 20px; height: 20px; border-radius: 50%;
            background: white; transition: left 0.2s;
        }
        .toggle-switch.on::after { left: 27px; }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; font-size: 13px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .rooms-grid { grid-template-columns: 1fr; }
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginScreen">
        <div class="login-box" id="loginBox">
            <div class="login-icon"><i class="fa-solid fa-bolt"></i></div>
            <h2>Hall Power Control</h2>
            <p class="login-sub">by IRZA Labs · Admin Access</p>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@hall.local" autocomplete="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-login" onclick="handleLogin()">Sign In</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="app" class="container hidden">
        <div class="top-bar">
            <div class="brand">
                <i class="fa-solid fa-bolt"></i>
                <h1>Hall Power Control</h1>
                <span class="status-dot" id="connDot"></span>
                <span id="connText" style="font-size:12px; color: var(--text-dim);">Connecting…</span>
            </div>
            <div class="clock" id="clock">--:--:--</div>
            <button class="btn btn-sm" onclick="handleLogout()"><i class="fa-solid fa-power-off"></i> Logout</button>
        </div>

        <div class="summary-grid">
            <div class="card"><div class="label">Active Rooms</div><div class="value" id="activeRooms">0</div></div>
            <div class="card"><div class="label">Total Load</div><div class="value cyan" id="totalPower">0 W</div></div>
            <div class="card"><div class="label">Total Consumed</div><div class="value amber" id="totalConsumed">0.00 kWh</div></div>
            <div class="card"><div class="label">Total Remaining</div><div class="value" id="totalRemaining">0.00 kWh</div></div>
        </div>

        <div class="rooms-grid" id="roomsContainer"></div>
    </div>

    <div class="toast-container" id="toastHost"></div>

    <script>
        // Firebase configuration (IRZA Labs project)
        const firebaseConfig = {
            apiKey: "AIzaSyC8NcbOPzhbUnm9NxOZyzdEJSLk_LOGYcc",
            authDomain: "irza-labs.firebaseapp.com",
            databaseURL: "https://irza-labs-default-rtdb.firebaseio.com",
            projectId: "irza-labs",
            storageBucket: "irza-labs.firebasestorage.app",
            messagingSenderId: "269557073409",
            appId: "1:269557073409:web:4c2977681884d733f62200"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // State
        const roomsConfig = { room1: { name: 'Room 01' }, room2: { name: 'Room 02' } };
        const roomData = {};
        const overloadTimers = {}; // roomId -> overload start timestamp

        // Toast notifications
        function toast(msg, type = 'info') {
            const host = document.getElementById('toastHost');
            const el = document.createElement('div');
            el.className = 'toast';
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            const color = type === 'error' ? 'var(--red)' : 'var(--cyan)';
            el.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}"></i> ${msg}`;
            host.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        // Clock
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Auth
        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) {
                document.getElementById('loginError').textContent = 'Enter both email and password.';
                return;
            }
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .catch(err => {
                    document.getElementById('loginError').textContent = 'Login failed. Check your credentials.';
                });
        }
        function handleLogout() { firebase.auth().signOut(); }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                if (!window._booted) { window._booted = true; boot(); }
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
            }
        });

        // Connection status
        db.ref('.info/connected').on('value', snap => {
            const dot = document.getElementById('connDot');
            const text = document.getElementById('connText');
            if (snap.val() === true) {
                dot.classList.remove('offline'); text.textContent = 'Live';
            } else {
                dot.classList.add('offline'); text.textContent = 'Reconnecting…';
            }
        });

        // Boot dashboard
        function boot() {
            Object.keys(roomsConfig).forEach(roomId => {
                roomData[roomId] = {
                    power: 0, voltage: 0,
                    current_units: 0, allocated_units: 0,
                    max_watt_limit: 0, status: 'OFF',
                    manual_cutoff: false, lastUpdate: 0
                };
                buildRoomCard(roomId);
                db.ref('rooms/' + roomId).on('value', snap => {
                    const d = snap.val();
                    if (!d) return;
                    const rd = roomData[roomId];
                    rd.power = d.power || 0;
                    rd.voltage = d.voltage || 0;
                    rd.current_units = d.current_units || 0;
                    rd.allocated_units = d.allocated_units || 0;
                    rd.max_watt_limit = d.max_watt_limit || 0;
                    rd.status = d.status || 'OFF';
                    rd.manual_cutoff = d.manual_cutoff === true;
                    rd.lastUpdate = Date.now();
                    updateRoomUI(roomId);
                    updateGlobalStats();
                    checkOverload(roomId);
                });
            });
            // Check overload timers every second
            setInterval(checkAllOverloads, 1000);
        }

        // Build room card (with manual unit entry, breaker default ON)
        function buildRoomCard(roomId) {
            const name = roomsConfig[roomId].name;
            const card = document.createElement('div');
            card.className = 'room-card';
            card.id = `card-${roomId}`;
            card.innerHTML = `
                <div class="room-header">
                    <h3><span class="room-led off" id="led-${roomId}"></span> ${name}</h3>
                    <span class="room-status" id="status-${roomId}">OFF</span>
                </div>
                <div class="metrics-grid">
                    <div class="metric"><div class="m-label">Current (A)</div><div class="m-value" id="curr-${roomId}">0.00</div></div>
                    <div class="metric"><div class="m-label">Voltage (V)</div><div class="m-value" id="volt-${roomId}">0.0</div></div>
                    <div class="metric"><div class="m-label">Power (W)</div><div class="m-value" id="power-${roomId}">0</div></div>
                    <div class="metric"><div class="m-label">Consumed (kWh)</div><div class="m-value" id="consumed-${roomId}">0.00</div></div>
                    <div class="metric"><div class="m-label">Allocated (kWh)</div><div class="m-value" id="alloc-${roomId}">0.00</div></div>
                    <div class="metric"><div class="m-label">Remaining (kWh)</div><div class="m-value" id="remain-${roomId}">0.00</div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-label"><span>Watt limit</span><span id="wattPercent-${roomId}">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="wattBar-${roomId}"></div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-label"><span>Unit usage</span><span id="unitPercent-${roomId}">0%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="unitBar-${roomId}"></div></div>
                </div>
                <div class="action-row">
                    <button onclick="addEnergy('${roomId}',1)">+1 kWh</button>
                    <button onclick="addEnergy('${roomId}',5)">+5 kWh</button>
                    <button onclick="boostWatt('${roomId}',200)">Boost +200W</button>
                    <input type="number" id="wattInput-${roomId}" placeholder="W">
                    <button onclick="setWattLimit('${roomId}')">Set</button>
                </div>
                <!-- Manual consumed unit entry -->
                <div class="action-row" style="margin-top: 8px;">
                    <input type="number" id="consumedInput-${roomId}" placeholder="kWh" step="0.01" style="width: 80px;">
                    <button onclick="setConsumedUnits('${roomId}')">Set Consumed</button>
                </div>
                <div class="breaker-row">
                    <span class="breaker-label">Circuit breaker</span>
                    <div class="toggle-switch on" id="breaker-${roomId}" onclick="toggleBreaker('${roomId}')"></div>
                </div>
            `;
            document.getElementById('roomsContainer').appendChild(card);
        }

        // Set consumed units manually
        function setConsumedUnits(roomId) {
            const val = parseFloat(document.getElementById(`consumedInput-${roomId}`).value);
            if (!isNaN(val) && val >= 0) {
                db.ref('rooms/' + roomId).update({ current_units: val });
                toast(`${roomsConfig[roomId].name} consumed units set to ${val.toFixed(2)} kWh`);
            }
        }

        // Update room card with real data
        function updateRoomUI(roomId) {
            const rd = roomData[roomId];
            const card = document.getElementById(`card-${roomId}`);
            if (!card || !rd) return;

            const online = (Date.now() - rd.lastUpdate) < 5000;
            const led = document.getElementById(`led-${roomId}`);
            led.className = 'room-led ' + (!online ? 'offline' : (rd.status.includes('ON') ? '' : 'off'));
            card.classList.toggle('overload', rd.max_watt_limit > 0 && rd.power > rd.max_watt_limit && rd.status.includes('ON'));
            document.getElementById(`status-${roomId}`).textContent = online ? rd.status : 'offline';

            const current = rd.voltage > 0 ? rd.power / rd.voltage : 0;
            document.getElementById(`curr-${roomId}`).textContent = current.toFixed(2);
            document.getElementById(`volt-${roomId}`).textContent = rd.voltage.toFixed(1);
            document.getElementById(`power-${roomId}`).textContent = rd.power.toFixed(0);
            document.getElementById(`consumed-${roomId}`).textContent = rd.current_units.toFixed(2);
            document.getElementById(`alloc-${roomId}`).textContent = rd.allocated_units.toFixed(2);
            const remaining = rd.allocated_units - rd.current_units;
            document.getElementById(`remain-${roomId}`).textContent = remaining.toFixed(2);

            // Watt progress bar
            const wattPct = rd.max_watt_limit > 0 ? Math.min(100, (rd.power / rd.max_watt_limit) * 100) : 0;
            document.getElementById(`wattPercent-${roomId}`).textContent = Math.round(wattPct) + '%';
            const wattBar = document.getElementById(`wattBar-${roomId}`);
            wattBar.style.width = wattPct + '%';
            wattBar.className = 'progress-fill' + (wattPct > 90 ? ' danger' : wattPct > 70 ? ' warn' : '');

            // Unit usage progress bar
            const unitPct = rd.allocated_units > 0 ? Math.min(100, (rd.current_units / rd.allocated_units) * 100) : 0;
            document.getElementById(`unitPercent-${roomId}`).textContent = Math.round(unitPct) + '%';
            const unitBar = document.getElementById(`unitBar-${roomId}`);
            unitBar.style.width = unitPct + '%';
            unitBar.className = 'progress-fill' + (unitPct > 90 ? ' danger' : unitPct > 70 ? ' warn' : '');

            // Breaker toggle switch
            const breaker = document.getElementById(`breaker-${roomId}`);
            if (rd.manual_cutoff) {
                breaker.classList.add('off'); breaker.classList.remove('on');
            } else {
                breaker.classList.add('on'); breaker.classList.remove('off');
            }
        }

        // Add kWh to allocated units
        function addEnergy(roomId, amount) {
            const current = roomData[roomId]?.allocated_units || 0;
            db.ref('rooms/' + roomId).update({ allocated_units: current + amount });
            toast(`Added ${amount} kWh to ${roomsConfig[roomId].name}`);
        }

        // Temporarily increase watt limit
        function boostWatt(roomId, amount) {
            const current = roomData[roomId]?.max_watt_limit || 0;
            db.ref('rooms/' + roomId).update({ max_watt_limit: current + amount });
            toast(`Increased watt limit by ${amount}W for ${roomsConfig[roomId].name}`);
        }

        // Set exact watt limit
        function setWattLimit(roomId) {
            const val = parseFloat(document.getElementById(`wattInput-${roomId}`).value);
            if (!isNaN(val) && val >= 0) {
                db.ref('rooms/' + roomId).update({ max_watt_limit: val });
                toast(`${roomsConfig[roomId].name} watt limit set to ${val}W`);
            }
        }

        // Manual breaker control
        function toggleBreaker(roomId) {
            const currentlyCut = roomData[roomId]?.manual_cutoff;
            db.ref('rooms/' + roomId).update({ manual_cutoff: !currentlyCut });
            toast(`${roomsConfig[roomId].name} ${!currentlyCut ? 'shut down' : 'restored'}`);
        }

        // Overload detection (start timer if power > limit)
        function checkOverload(roomId) {
            const rd = roomData[roomId];
            if (!rd) return;
            if (rd.max_watt_limit > 0 && rd.power > rd.max_watt_limit && rd.status.includes('ON')) {
                if (!overloadTimers[roomId]) overloadTimers[roomId] = Date.now();
            } else {
                delete overloadTimers[roomId];
            }
        }

        // Every second, check if any overload lasted 5+ seconds
        function checkAllOverloads() {
            const now = Date.now();
            for (const [roomId, start] of Object.entries(overloadTimers)) {
                if (now - start >= 5000) {
                    const rd = roomData[roomId];
                    if (rd && !rd.manual_cutoff) {
                        // Auto-shutdown: trigger manual_cutoff via Firebase
                        db.ref('rooms/' + roomId).update({ manual_cutoff: true });
                        toast(`${roomsConfig[roomId].name} auto‑shutdown after 5s overload!`, 'error');
                        // Buzzer handled by ESP32 hardware
                    }
                    delete overloadTimers[roomId];
                }
            }
        }

        // Global summary stats
        function updateGlobalStats() {
            let totalPower = 0, totalConsumed = 0, totalRemaining = 0, active = 0;
            Object.keys(roomData).forEach(id => {
                const d = roomData[id];
                totalPower += d.power;
                totalConsumed += d.current_units;
                totalRemaining += (d.allocated_units - d.current_units);
                if (d.status.includes('ON')) active++;
            });
            document.getElementById('activeRooms').textContent = active;
            document.getElementById('totalPower').textContent = totalPower.toFixed(0) + ' W';
            document.getElementById('totalConsumed').textContent = totalConsumed.toFixed(2) + ' kWh';
            document.getElementById('totalRemaining').textContent = totalRemaining.toFixed(2) + ' kWh';
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            Object.keys(roomData).forEach(id => db.ref('rooms/' + id).off());
        });
    </script>
